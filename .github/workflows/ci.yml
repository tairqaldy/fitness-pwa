name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # `wrangler types` output is committed, but regenerate it here so a stale
      # cloudflare-env.d.ts cannot mask a wrangler.jsonc change. Needs no credentials.
      - name: Generate Cloudflare types
        run: npm run cf-typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # Catches the drift between the drizzle schema and the generated migrations --
      # i.e. someone edited src/db/schema.ts and forgot `npm run db:generate`.
      - name: Migration consistency
        run: npx drizzle-kit check

      - name: Build
        run: npm run build

  # Deploy is deliberately NOT automatic. A bad deploy to a single-user production app is
  # worse than a slow one, and the OpenNext build needs its own verification pass.
  # Run `npm run deploy` locally, or dispatch this job once CLOUDFLARE_API_TOKEN is set.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          # Token needs: Workers Scripts:Edit, D1:Edit, Workers KV Storage:Edit,
          # Workers R2 Storage:Edit, Account Settings:Read
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
